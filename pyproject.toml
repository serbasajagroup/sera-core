[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sera-core"
version = "0.1.0"
description = "Human-in-the-loop safety layer for local Codex agents: scoped approvals, chat-based allow/deny, secret redaction."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "PT Serba Saja Grup" }]
keywords = ["codex", "ai-agents", "approval", "human-in-the-loop", "whatsapp", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/serbasajagroup/sera-core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
